# the dataset to use, can be ARCADE_SMALL, ARCADE_BIG, BUSYBOX_SMALL, BUSYBOX_BIG
# DATASET: "ARCADE_SMALL"  
# DATASET: "ARCADE_BIG"
DATASET: "BUSYBOX_BIG"
# DATASET: "BUSYBOX_SMALL"
# DATASET: "B2C_SMALL"
# DATASET: "B2C_BIG"

PATHS:
  B2C_SMALL:
    MODEL_PATH: "Models/b2c_small"  # path to the folder of trained models
    TRAINDATA_INPUT_PATH: "TrainingData/b2c_small/invalid_confs_3207.csv" # invalid configurations (all stored in .csv file)
    TRAINDATA_OUTPUT_PATH: "TrainingData/b2c_small/conflicts_3207.csv"    # conflicts computed by the solver (also stored in .csv format)
    TRAINDATA_CONSTRAINTS_NAME_PATH: "TrainingData/b2c_small/leaf_features.txt" # name of all constraints (must be same order as in the .csv file)
    TRAINDATA_FM_PATH: "TrainingData/b2c_small/b2c.sxfm"   # the feature model (SPLX file), needed for solver
  
  B2C_BIG:
    MODEL_PATH: "Models/b2c_big"  # path to the folder of trained models
    TRAINDATA_INPUT_PATH: "TrainingData/b2c_big/invalid_confs_79550.csv" # invalid configurations (all stored in .csv file)
    TRAINDATA_OUTPUT_PATH: "TrainingData/b2c_big/conflicts_79550.csv"    # conflicts computed by the solver (also stored in .csv format)
    TRAINDATA_CONSTRAINTS_NAME_PATH: "TrainingData/b2c_big/leaf_features.txt" # name of all constraints (must be same order as in the .csv file)
    TRAINDATA_FM_PATH: "TrainingData/b2c_big/b2c.sxfm"   # the feature model (SPLX file), needed for solver
  
  ARCADE_SMALL:
    MODEL_PATH: "Models/arcade_small"  # path to the folder of trained models
    TRAINDATA_INPUT_PATH: "TrainingData/arcade_small/invalid_confs_1640.csv" # invalid configurations (all stored in .csv file)
    TRAINDATA_OUTPUT_PATH: "TrainingData/arcade_small/conflicts_1640.csv"    # conflicts computed by the solver (also stored in .csv format)
    TRAINDATA_CONSTRAINTS_NAME_PATH: "TrainingData/arcade_small/arcade_constraints_names.txt" # name of all constraints (must be same order as in the .csv file)
    TRAINDATA_FM_PATH: "TrainingData/arcade_small/arcade-game.splx"   # the feature model (SPLX file), needed for solver
  
  ARCADE_BIG:
    MODEL_PATH: "Models/arcade_big"  # path to the folder of trained models
    TRAINDATA_INPUT_PATH: "TrainingData/arcade_big/invalid_confs_32003.csv" # invalid configurations (all stored in .csv file)
    TRAINDATA_OUTPUT_PATH: "TrainingData/arcade_big/conflicts_32003.csv"    # conflicts computed by the solver (also stored in .csv format)
    TRAINDATA_CONSTRAINTS_NAME_PATH: "TrainingData/arcade_big/arcade_constraints_names.txt" # name of all constraints (must be same order as in the .csv file)
    TRAINDATA_FM_PATH: "TrainingData/arcade_big/arcade-game.splx"   # the feature model (SPLX file), needed for solver

  BUSYBOX_SMALL:
    MODEL_PATH: "Models/busybox_small"  # path to the folder of trained models
    TRAINDATA_INPUT_PATH: "TrainingData/busybox_small/invalid_confs_3020.csv" # invalid configurations (all stored in .csv file)
    TRAINDATA_OUTPUT_PATH: "TrainingData/busybox_small/conflicts_3020.csv"    # conflicts computed by the solver (also stored in .csv format)
    TRAINDATA_CONSTRAINTS_NAME_PATH: "TrainingData/busybox_small/busybox_constraints_names.txt" # name of all constraints (must be same order as in the .csv file)
    TRAINDATA_FM_PATH: "TrainingData/busybox_small/busybox-1.18.0.xml"   # the feature model, needed for solver (XML file)

  BUSYBOX_BIG:
    MODEL_PATH: "Models/busybox_big"  # path to the folder of trained models
    TRAINDATA_INPUT_PATH: "TrainingData/busybox_big/invalid_confs_96199.csv" # invalid configurations (all stored in .csv file)
    TRAINDATA_OUTPUT_PATH: "TrainingData/busybox_big/conflicts_96199.csv"    # conflicts computed by the solver (also stored in .csv format)
    TRAINDATA_CONSTRAINTS_NAME_PATH: "TrainingData/busybox_big/busybox_constraints_names.txt" # name of all constraints (must be same order as in the .csv file)
    TRAINDATA_FM_PATH: "TrainingData/busybox_big/busybox-1.18.0.xml"   # the feature model, needed for solver (XML file)


  SOLVER_INPUT_PATH: "Solver/Input"     # invalid configurations (each config is a text file)
  SOLVER_OUTPUT_PATH: "Solver/Output"   # conflicts computed by the solver (each conflict is a text file)
  SOLVER_PATH: "Solver/fm_conflict.jar"     # the solver's code (JAR file)
  SOLVER_LOGS_PATH: "Solver/Logs"     # store the logs of the solver (if any)

  JAVA_PATH: "java"     # default java path (if java is installed in the system)
  # JAVA_PATH: "jdk-24_windows-x64_bin/jdk-24.0.1/bin/java.exe" # path to the "java.exe". path should starts from root directory. (this is for when java cant be install in the system)


CLEAR:  # this is currently not set up yet
  SKIP: false            # skip clearing the folders below if set to true
  LOGS: true            # clear the logs folder (if any) before ruDecisionTreeing the script
  Solver's input/output: true       # clear the solver's input/output folders (if any) before ruDecisionTreeing the script
  MODELS: false           # clear all trained models from the past



WORKFLOW: # what the program do or not do (to allow doing only partial work instead of full training every run)
  RETRAIN: # retrain all the models in Models folder, using exact configs.
    SKIP: true # if we doing retraining then the training phase below will be skipped.
  TRAIN:
    SKIP: false # skip training if the model already exists and stored in the model folder
    
    # The number of trials/configurations to try. The higher the number, the longer the training will take, but the better the results will be.
    optuna_trials: 50  # number of trials for Optuna to find the best hyperparameters (100 means 100 different configurations will be tested)
    optuna_goal: "COMBINED" # the metric that Optuna will try to maximize (F1, EXACT_MATCH, MCC, MAP, HAMMING_LOSS, COMBINED)
    # Note each session should only train 6 hyperparams,  

    configurations:   # different configs for different models to find best model
      # NOTE: the more configurations, the more time it takes to train the model

      convert_input: [true] # [true, false]   # convert input data from (-1 and 1) to (0 and 1) for training

      # number of neurons in hidden layers, can be more than one layer, e.g. [2, 3] means 2 hidden layers with 2 and 3 neurons respectively
      # [[32], [64], [128], [32, 32], [64, 32], [64, 64], [128, 64], [128, 128], [256, 128, 64] ]
      hidden_layers: [[64, 32], [64, 64], [128, 64], [32, 64, 32], [128, 64, 32], [64, 128, 64] ]
      dropout: [false] 
      dropout_rates: [0.1, 0.5] # [0.0, 0.4]  # Min Max values only, dropout rate for the hidden layers (to prevent overfitting). 
      hidden_activation_funcs: ['relu'] # ['relu', 'leaky relu']  # activation function for the hidden layers

      batch_sizes: [64, 128, 256, 512, 1024] # [32, 64, 128, 256, 512, 1024]   # test size for train/test split
      batch_norm: [true] # [false, true]  # use batch normalization or not

      max_epochs: 300 # [50, 100]  # 1 epoch is 1 full pass of training data. This is not tuned by Optuna
      patience: 20 # null, 10, 15, 20  # number of epochs with no improvement after which training will be stopped. also not tuned by Optuna

      loss_funcs: ['Focal Loss'] # ['bcewithlogitloss', 'Focal Loss'] # loss function to use for training (binary cross entropy with logits or binary cross entropy)
      focal_loss_gamma: [2.0, 5.0] # [0] or [1.0, 2.0, 3.0] MINMAX  # this is only applied when loss func is focal loss, else keep it null!!
      focal_loss_alpha: [0.1 ,0.5] # [0] or [0.25, 0.5]
      optimizers: ['Adam']  # ['Adam', 'SGD', 'AdamW']  # optimizers to use (loss function minimization algorithm)
      learning_rates: [0.00001, 0.01] # [0.01, 0.1]  # Min Max values only,  learning rate for the optimizer
      weight_decays: [0.00001, 0.05] # [0.0001, 0.001]  # Min Max values only, weight decay for the optimizer

      use_pca_options: [false]    #[false, true]   PCA reduces the dimensionality of the data, help training faster, but also might lose some information of training data 
      

  TEST:  # test the trained model directly with QuickXPlain, tested on unseen data.
    SKIP: true # skip validation part completely
    # Note: set the path to the folder of the models we want to validate (set the MODEL_PATH in the PATHS section above)
    models_to_test: ["F1", "EXACT_MATCH", "MCC", "MAP", "HAMMING_LOSS", "COMBINED"]  # ["F1", "EXACT_MATCH", "MCC", "MAP", "HAMMING_LOSS", "COMBINED"] specify which models to be tested.


