DATASET: "ARCADE_SMALL"  # the dataset to use, can be ARCADE_SMALL, ARCADE_BIG, BUSYBOX_SMALL, BUSYBOX_BIG

PATHS:
  ARCADE_SMALL:
    MODEL_PATH: "Models/arcade"  # path to the folder of trained models
    TRAINDATA_INPUT_PATH: "TrainingData/arcade/invalid_confs_1640.csv" # invalid configurations (all stored in .csv file)
    TRAINDATA_OUTPUT_PATH: "TrainingData/arcade/conflicts_1640.csv"    # conflicts computed by the solver (also stored in .csv format)
    TRAINDATA_CONSTRAINTS_NAME_PATH: "TrainingData/arcade/arcade_constraints_names.txt" # name of all constraints (must be same order as in the .csv file)
    TRAINDATA_FM_PATH: "TrainingData/arcade/arcade-game.splx"   # the feature model (SPLX file), needed for solver
  
  ARCADE_BIG:
    MODEL_PATH: "Models/arcade"  # path to the folder of trained models
    TRAINDATA_INPUT_PATH: "TrainingData/arcade/invalid_confs_32003.csv" # invalid configurations (all stored in .csv file)
    TRAINDATA_OUTPUT_PATH: "TrainingData/arcade/conflicts_32003.csv"    # conflicts computed by the solver (also stored in .csv format)
    TRAINDATA_CONSTRAINTS_NAME_PATH: "TrainingData/arcade/arcade_constraints_names.txt" # name of all constraints (must be same order as in the .csv file)
    TRAINDATA_FM_PATH: "TrainingData/arcade/arcade-game.splx"   # the feature model (SPLX file), needed for solver

  BUSYBOX_SMALL:
    MODEL_PATH: "Models/busybox"  # path to the folder of trained models
    TRAINDATA_INPUT_PATH: "TrainingData/busybox/busybox_invalid_confs_655.csv" # invalid configurations (all stored in .csv file)
    TRAINDATA_OUTPUT_PATH: "TrainingData/busybox/busybox_conflicts_655.csv"    # conflicts computed by the solver (also stored in .csv format)
    TRAINDATA_CONSTRAINTS_NAME_PATH: "TrainingData/busybox/busybox_constraints_names.txt" # name of all constraints (must be same order as in the .csv file)
    TRAINDATA_FM_PATH: "TrainingData/busybox/busybox-1.18.0.xml"   # the feature model, needed for solver (XML file)

  BUSYBOX_BIG:
    MODEL_PATH: "Models/busybox"  # path to the folder of trained models
    TRAINDATA_INPUT_PATH: "TrainingData/busybox/invalid_confs_126725.csv" # invalid configurations (all stored in .csv file)
    TRAINDATA_OUTPUT_PATH: "TrainingData/busybox/conflicts_126725.csv"    # conflicts computed by the solver (also stored in .csv format)
    TRAINDATA_CONSTRAINTS_NAME_PATH: "TrainingData/busybox/busybox_constraints_names.txt" # name of all constraints (must be same order as in the .csv file)
    TRAINDATA_FM_PATH: "TrainingData/busybox/busybox-1.18.0.xml"   # the feature model, needed for solver (XML file)


  SOLVER_INPUT_PATH: "Solver/Input"     # invalid configurations (each config is a text file)
  SOLVER_OUTPUT_PATH: "Solver/Output"   # conflicts computed by the solver (each conflict is a text file)
  SOLVER_PATH: "Solver/fm_conflict.jar"     # the solver's code (JAR file)
  SOLVER_LOGS_PATH: "Solver/Logs"     # store the logs of the solver (if any)

  JAVA_PATH: "java"     # default java path (if java is installed in the system)
  # JAVA_PATH: "jdk-24_windows-x64_bin/jdk-24.0.1/bin/java.exe" # path to the "java.exe". path should starts from root directory. (this is for when java cant be install in the system)


CLEAR:  # this is currently not set up yet
  SKIP: false            # skip clearing the folders below if set to true
  LOGS: true            # clear the logs folder (if any) before ruDecisionTreeing the script
  Solver's input/output: true       # clear the solver's input/output folders (if any) before ruDecisionTreeing the script
  MODELS: false           # clear all trained models from the past



WORKFLOW: # what the program do or not do (to allow doing only partial work instead of full training every run)
  TRAIN:
    SKIP: false # skip training if the model already exists and stored in the model folder

    # The number of trials/configurations to try. The higher the number, the longer the training will take, but the better the results will be.
    optuna_trials: 30  # number of trials for Optuna to find the best hyperparameters (100 means 100 different configurations will be tested)
    optuna_goal: "MCC" # the metric that Optuna will try to maximize (F1, EXACT_MATCH, MCC, MAP, HAMMING_LOSS, COMBINED)
    # Note each session should only train 6 hyperparams,  

    configurations:   # different configs for different models to find best model
      # NOTE: the more configurations, the more time it takes to train the model

      test_size: [0.1, 0.9]   # continuous range, so min max values. test size for train/test split
      max_depth: [10, 20, 30, 40, 50, 60, 70, 80, 90, null]       # max training depth, null for unlimited depth
      estimator_type: ['DecisionTree', 'RandomForest']    # ['DecisionTree', 'RandomForest']
      multi_output_type: ['MultiOutputClassifier', 'ClassifierChain']         # ['MultiOutputClassifier', 'ClassifierChain', 'Direct']  # 'Direct' should never be alone in this list, else could cause an error, since it only works with RandomForest
      use_pca: [false, true]    #[false, true]   PCA reduces the dimensionality of the data, help training faster, but also might lose some information of training data
      class_weight: ['balanced', null]       # [null, 'balanced']    # use 'balanced' to give more weight to the minority class in case of imbalanced data 
      n_estimator: [1]   # Min max values. number of estimators for only RandomForest (only used if estimator_type is 'RandomForest')
  VALIDATE:  # test the trained model directly with QuickXPlain, tested on unseen data.
    SKIP: true # skip validation part completely if set to true
    # Note: set the path to the folder of the models we want to validate (set the MODEL_PATH in the PATHS section above)
    # Note: the selected dataset must also be correctly set in the PATHS section above
    models_to_test: ["F1", "EXACT_MATCH", "MCC", "MAP", "HAMMING_LOSS", "COMBINED"]  # ["F1", "EXACT_MATCH", "MCC", "MAP", "HAMMING_LOSS", "COMBINED"]  specify which models to be tested.


